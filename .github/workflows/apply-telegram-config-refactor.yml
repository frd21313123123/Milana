name: Apply service state refactor

on:
  push:
    branches:
      - refactor/project-optimization
    paths:
      - scripts/apply_service_state_refactor.py

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Apply refactor
        run: python scripts/apply_service_state_refactor.py

      - name: Compile
        run: python -m compileall -q . -x '(\.git|\.venv|venv|data|sessions)'

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m unittest discover -v

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add milana_service.py milana/service_state.py pyproject.toml
          if git diff --cached --quiet; then
            echo "No refactor changes to commit"
            exit 0
          fi
          git commit -m "Extract service state reducer"
          git push origin HEAD:refactor/project-optimization
