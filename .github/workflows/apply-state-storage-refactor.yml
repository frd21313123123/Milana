name: Apply state storage refactor

on:
  push:
    branches:
      - refactor/project-optimization
    paths:
      - scripts/apply_state_schema_refactor.py
      - scripts/apply_state_telegram_refactor.py

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Apply schema refactor
        if: hashFiles('scripts/apply_state_schema_refactor.py') != '' && hashFiles('milana/state_schema.py') == ''
        run: python scripts/apply_state_schema_refactor.py

      - name: Apply Telegram persistence refactor
        if: hashFiles('scripts/apply_state_telegram_refactor.py') != '' && hashFiles('milana/state_telegram.py') == ''
        run: python scripts/apply_state_telegram_refactor.py

      - name: Compile
        run: python -m compileall -q . -x '(\.git|\.venv|venv|data|sessions)'

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m unittest discover -v

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add milana_state.py
          test ! -f milana/state_schema.py || git add milana/state_schema.py
          test ! -f milana/state_telegram.py || git add milana/state_telegram.py
          if git diff --cached --quiet; then
            echo "No refactor changes to commit"
            exit 0
          fi
          git commit -m "Extract state storage components"
          git push origin HEAD:refactor/project-optimization
