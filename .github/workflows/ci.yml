name: CI

on:
  push:
    branches:
      - main
      - "refactor/**"
  pull_request:

concurrency:
  group: milana-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile all Python files
        run: python -m compileall -q . -x "(\.git|\.venv|venv|data|sessions)"

      - name: Run correctness lint
        run: python -m ruff check .

      - name: Run unit tests
        run: python -m unittest discover -v
