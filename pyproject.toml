[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
  ".git",
  ".venv",
  "venv",
  "data",
  "sessions",
]

[tool.ruff.lint]
# Start with correctness checks only. This catches broken imports, undefined names
# and syntax-adjacent issues without forcing a style rewrite of the existing codebase.
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
branch = true
source = ["milana"]
omit = [
  "test_*.py",
  "test_support/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
