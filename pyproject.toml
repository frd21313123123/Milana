[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
  ".git",
  ".venv",
  "venv",
  "data",
  "sessions",
]

[tool.ruff.lint]
# Start with correctness checks only. This catches broken imports, undefined names
# and syntax-adjacent issues without forcing a style rewrite of the existing codebase.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
# Pre-existing legacy debt: milana_service.py references GEMINI_LLM_CHOICE without
# importing it. Keep F821 enabled everywhere else while the large service module
# is split into smaller components in the next refactor step.
"milana_service.py" = ["F821"]
